[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehiclegpt"
version = "0.1.0"
description = "Natural-language vehicle information using an on-device SLM/LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately minimal. Every heavy dependency is optional so the data plane
# runs on a 2 GB device and CI needs nothing at all.
dependencies = [
    "cantools>=39",
    "python-can>=4.3",
    "PyYAML>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["vehiclegpt*"]

[tool.setuptools.package-data]
vehiclegpt = ["dbc/*.dbc", "schema/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
